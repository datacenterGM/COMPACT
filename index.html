<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Penjualan &amp; Uang Masuk</title>
<style>
  :root, html[data-theme="dark"] {
    --bg:#0f172a; --card:#1e293b; --card2:#334155; --border:#475569;
    --text:#f1f5f9; --muted:#94a3b8; --accent:#3b82f6;
  }
  html[data-theme="light"] {
    --bg:#f1f5f9; --card:#ffffff; --card2:#e2e8f0; --border:#cbd5e1;
    --text:#0f172a; --muted:#64748b; --accent:#2563eb;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);
  }
  .tabbar {
    display:flex; align-items:center; gap:6px; flex:0 0 auto;
    padding:6px 10px; border-bottom:1px solid var(--border);
    background:var(--bg); overflow-x:auto;
  }
  .tab {
    height:28px; min-width:54px; padding:0 14px; border-radius:5px;
    border:1px solid var(--border); background:var(--card); color:var(--text);
    font:700 0.78rem/1 'Segoe UI', system-ui, sans-serif; letter-spacing:.04em;
    cursor:pointer; white-space:nowrap; transition:background .15s, border-color .15s;
  }
  .tab:hover { border-color:var(--accent); background:var(--card2); }
  .tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tab.busy::after { content:' …'; opacity:.7; }
  .spacer { flex:1; }
  .theme {
    height:28px; width:34px; border-radius:5px; border:1px solid var(--border);
    background:transparent; color:var(--text); cursor:pointer; font-size:.85rem;
  }
  .theme:hover { border-color:var(--accent); background:var(--card2); }
  .stage { flex:1 1 auto; position:relative; min-height:0; }
  iframe {
    position:absolute; inset:0; width:100%; height:100%;
    border:0; background:var(--bg); display:none;
  }
  iframe.show { display:block; }
</style>
<script>
  (function () {
    try {
      var t = localStorage.getItem('um_theme') || localStorage.getItem('theme') || 'dark';
      if (t !== 'light' && t !== 'dark') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
</head>
<body>
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="cari">🔍 CARI</button>
    <button class="tab" data-tab="pj">PJ</button>
    <button class="tab" data-tab="um">UM</button>
    <button class="tab" data-tab="titip">🤝 TITIP</button>
    <button class="tab" data-tab="cek">CEK</button>
    <button class="tab" data-tab="ar">AR</button>
    <span class="spacer"></span>
    <button class="theme" id="themeBtn" title="Mode gelap / terang">🌙</button>
  </nav>
  <div class="stage" id="stage"></div>

<script>
(function () {
  var PAGES = { cari:'cari.html', pj:'PJ.html', um:'UM.html', titip:'UM.html', cek:'CEK.html', ar:'AR.html' };
  var QUERY = { titip:'?view=titip' };   // TITIP = UM.html dalam mode khusus TITIP
  var frames = {};          // key -> iframe (dibuat saat tab pertama kali dibuka)
  var stale  = {};          // key -> true bila data PJ/UM mungkin berubah sejak dimuat
  var current = null;
  var stage = document.getElementById('stage');

  /* Rapikan tampilan halaman di dalam tab (tombol Dashboard diganti tab ini) */
  var EMBED_CSS =
    'a[href="index.html"]{display:none!important}' +
    'header:has(a.nav-btn){display:none!important}';

  function keyFromHref(href) {
    try {
      var u = new URL(href, location.href);
      var file = u.pathname.split('/').pop().toLowerCase();
      if (file === 'um.html' && u.searchParams.get('view') === 'titip') return { key:'titip', search:u.search };
      for (var k in PAGES) if (PAGES[k].toLowerCase() === file && !QUERY[k]) return { key:k, search:u.search };
      if (file === 'index.html' || file === '') return { key:'cari', search:'' };
    } catch (e) {}
    return null;
  }

  /* Setelah halaman anak dimuat: sisipkan CSS + tangkap klik link antar halaman */
  function hook(frame) {
    try {
      var d = frame.contentDocument;
      if (!d || !d.head || d.__hooked) return;
      if (String(d.location.href) === 'about:blank') return;   // dokumen kosong sebelum halaman asli tiba
      d.__hooked = true;
      var s = d.createElement('style'); s.textContent = EMBED_CSS; d.head.appendChild(s);
      d.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href]');
        if (!a || e.defaultPrevented) return;
        var t = keyFromHref(a.href);
        if (!t) return;
        e.preventDefault();
        show(t.key, t.search);
      });
    } catch (err) { /* beda origin (mis. file://): link tetap jalan di dalam tab */ }
  }

  function setBusy() {            // tampilkan "Memuat…" di tab yang masih memuat
    document.querySelectorAll('.tab').forEach(function (b) {
      var f = frames[b.dataset.tab];
      b.classList.toggle('busy', !!f && !f.__done);
    });
  }
  function make(key, search) {
    var f = document.createElement('iframe');
    f.title = key.toUpperCase();
    f.addEventListener('load', function () { hook(f); f.__done = true; setBusy(); });
    /* pasang perapian lebih awal (tanpa menunggu semua file/CDN selesai), supaya tab tidak tampak macet */
    var tries = 0, iv = setInterval(function () {
      hook(f);
      if (f.__done || ++tries > 300) clearInterval(iv);
    }, 100);
    f.src = PAGES[key] + (search || QUERY[key] || '');
    stage.appendChild(f);
    frames[key] = f;
    setBusy();
    return f;
  }

  /* Muat ulang data tab CARI / CEK tanpa menghilangkan kata kunci & filter */
  function refresh(key) {
    var f = frames[key];
    stale[key] = false;
    try {
      var w = f.contentWindow, d = f.contentDocument;
      if (key === 'cek') { d.getElementById('bReload').click(); return; }
      if (key === 'cari') {
        Promise.all([w.loadPenjualan(), w.loadUangMasuk()]).then(function () { w.doSearch(); });
        return;
      }
    } catch (e) {}
    f.contentWindow.location.reload();
  }

  function show(key, search) {
    if (!PAGES[key]) key = 'cari';
    var f = frames[key];
    if (!f) f = make(key, search);
    else if (search && !QUERY[key]) { f.src = PAGES[key] + search; stale[key] = false; }   // dibuka dari link (mis. ▲ / ▼)
    else if (stale[key]) refresh(key);

    if (key === 'pj' || key === 'um') { stale.cari = true; stale.cek = true; stale.titip = true; }

    for (var k in frames) frames[k].classList.toggle('show', k === key);
    document.querySelectorAll('.tab').forEach(function (b) {
      b.classList.toggle('active', b.dataset.tab === key);
    });
    current = key;
    if (location.hash !== '#' + key) history.replaceState(null, '', '#' + key);
  }

  document.getElementById('tabbar').addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (b) show(b.dataset.tab);
  });

  /* ===== tema: ikut tombol di sini, dan ikut tombol di dalam tab ===== */
  var themeBtn = document.getElementById('themeBtn');
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'light' ? '☀️' : '🌙';
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'light' ? '#e2e8f0' : '#0f172a');
    for (var k in frames) {
      try { frames[k].contentDocument.documentElement.setAttribute('data-theme', t); } catch (e) {}
    }
  }
  themeBtn.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('um_theme', next); localStorage.setItem('theme', next); } catch (e) {}
    applyTheme(next);
  });
  window.addEventListener('storage', function (e) {
    if ((e.key === 'um_theme' || e.key === 'theme') && (e.newValue === 'light' || e.newValue === 'dark')) applyTheme(e.newValue);
  });
  applyTheme(document.documentElement.getAttribute('data-theme'));

  /* ===== mulai: #pj / #um / #cek / #ar / #cari (default CARI) ===== */
  window.addEventListener('hashchange', function () {
    var k = location.hash.slice(1).toLowerCase();
    if (PAGES[k] && k !== current) show(k);
  });
  var start = location.hash.slice(1).toLowerCase();
  show(PAGES[start] ? start : 'cari', location.search);
})();
</script>
</body>
</html>
