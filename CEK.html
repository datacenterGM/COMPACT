<style>
  :root {
    --primary:#1F4E79; --bg:#f0f4f8; --card:#fff; --border:#d0d7de; --text:#1a1a2e; --muted:#6b7280;
    --hover:#eef3fb; --input:#fff; --th1:#0d47a1; --th2:#1F4E79; --thu:#2e5e4e;
    --ok-bg:#ecfdf5; --ok-tx:#047857; --df-bg:#fef2f2; --df-tx:#b91c1c; --no-bg:#fffbeb; --no-tx:#92400e;

  }
  :root[data-theme="dark"] {
    --primary:#58a6ff; --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e;
    --hover:#1c2533; --input:#0d1117; --th1:#1f4e8c; --th2:#1b3a5f; --thu:#245445;
    --ok-bg:#0f2a20; --ok-tx:#56d364; --df-bg:#3b1a1f; --df-tx:#ff7b72; --no-bg:#3a2e12; --no-tx:#ffd58a;
    color-scheme: dark;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:'Segoe UI',system-ui,Arial,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden; font-size:.8rem; }
  .bar { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; padding:.5rem .7rem; background:var(--card); border-bottom:1px solid var(--border); flex-shrink:0; }
  .bar .ttl { font-weight:700; color:var(--primary); margin-right:auto; font-size:.9rem; }
  select, input[type=text] { padding:.32rem .6rem; border:1px solid var(--border); border-radius:6px; background:var(--input); color:var(--text); font-size:.8rem; outline:none; }
  input[type=text] { flex:1 1 180px; min-width:150px; max-width:340px; }
  .acts { display:flex; gap:.3rem; margin-left:auto; white-space:nowrap; }
  .acts .btn { padding:.32rem .55rem; min-width:2rem; text-align:center; }
  .bar { gap:.4rem; padding:.4rem .6rem; }
  .bar select { max-width:170px; }
  .btn { padding:.32rem .8rem; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--primary); font-weight:600; font-size:.78rem; cursor:pointer; }
  .btn:hover { background:var(--hover); }
  .chips { display:flex; flex-wrap:wrap; gap:.5rem; padding:.5rem .7rem; flex-shrink:0; }
  .chip { flex:1; min-width:150px; display:grid; grid-template-columns:1fr auto; align-items:center; gap:.1rem .5rem; padding:.4rem .7rem; border:1px solid var(--border); border-radius:6px; background:var(--card); cursor:pointer; font-weight:600; }
  .chip:hover { background:var(--hover); }
  .chip.on { box-shadow:0 0 0 2px var(--primary) inset; }
  .chip .amt { grid-column:1 / -1; font-size:.72rem; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; }
  .chip.c-ok .amt { color:var(--ok-tx); } .chip.c-df .amt { color:var(--df-tx); } .chip.c-no .amt { color:var(--no-tx); }
  .chip .v { font-variant-numeric:tabular-nums; }
  .chip.c-ti .v, .chip.c-ti .amt { color:#2563eb; }
  :root[data-theme="dark"] .chip.c-ti .v, :root[data-theme="dark"] .chip.c-ti .amt { color:#58a6ff; }
  tr.r-ti td:first-child { box-shadow:3px 0 0 #2563eb inset; }
  .chip.c-ok .v { color:var(--ok-tx); } .chip.c-df .v { color:var(--df-tx); } .chip.c-no .v { color:var(--no-tx); }
  .wrap { flex:1; min-height:0; overflow:auto; margin:0 .7rem; border:1px solid var(--border); border-radius:8px; background:var(--card); }
  table { width:100%; border-collapse:collapse; }
  thead { position:sticky; top:0; z-index:2; }

  th.g1 { background:var(--th1); font-size:.8rem; letter-spacing:.5px; } th.g2 { background:var(--thu); font-size:.8rem; letter-spacing:.5px; }
  th.c1 { background:var(--th2); } th.c2 { background:var(--thu); }
  td { padding:.25rem .5rem; border-bottom:1px solid var(--border); border-right:1px solid var(--border); white-space:nowrap; vertical-align:middle; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; } td.ctr { text-align:center; }

  tr.r-df td:first-child { box-shadow:3px 0 0 var(--df-tx) inset; } tr.r-no td:first-child { box-shadow:3px 0 0 var(--no-tx) inset; } tr.r-ok td:first-child { box-shadow:3px 0 0 var(--ok-tx) inset; }
  td.od { text-align:center; font-weight:700; font-variant-numeric:tabular-nums; } td.od.o1 { color:var(--no-tx); } td.od.o2 { color:var(--df-tx); } td.od.o0 { color:var(--muted,#94a3b8); font-weight:400; }
  .st { display:inline-block; padding:1px 8px; border-radius:5px; font-weight:700; font-size:.7rem; }
  .st.lunas { background:#2563eb; color:#fff; } .st.titip { background:#fef08a; color:#854d0e; border:1px solid #eab308; }
  .st.orph { background:var(--df-bg); color:var(--df-tx); border:1px solid var(--df-tx); }
  tr.r-or td:first-child { box-shadow:3px 0 0 #a855f7 inset; }
  .st.none { background:var(--no-bg); color:var(--no-tx); border:1px solid #fcd34d; }
  .bad { color:var(--df-tx); font-weight:600; } .good { color:var(--ok-tx); font-weight:600; } .dim { color:var(--muted); }
  .x { display:inline-block; margin:1px 3px 1px 0; padding:0 6px; border-radius:4px; background:var(--df-bg); color:var(--df-tx); font-weight:600; font-size:.72rem; }
  .empty { padding:3rem 1rem; text-align:center; color:var(--muted); }
  .pager { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; justify-content:space-between; padding:.35rem .7rem; color:var(--muted); font-size:.75rem; flex-shrink:0; }

  tr.clk { cursor:pointer; }
  .ov { display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55); align-items:center; justify-content:center; padding:12px; }
  .ov.show { display:flex; }

  .mbody h4 { font-size:.72rem; color:var(--primary); text-transform:uppercase; letter-spacing:.4px; margin:.7rem 0 .3rem; }
  .mt { width:100%; border-collapse:collapse; font-size:.74rem; } .mt th { background:var(--th2); color:#fff; padding:.25rem .4rem; text-align:left; } .mt td { padding:.22rem .4rem; border:1px solid var(--border); white-space:normal; }
  .mbody textarea { width:100%; min-height:60px; padding:.5rem; border:1px solid var(--border); border-radius:6px; background:var(--input); color:var(--text); font:inherit; resize:vertical; }
  .mfoot { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:.5rem; padding:.7rem 1rem; border-top:1px solid var(--border); }
  .btn.ok { background:#059669; color:#fff; border-color:#059669; } .btn.warn { background:#d97706; color:#fff; border-color:#d97706; }
  a.go { display:inline-block; margin-left:6px; padding:0 5px; border:1px solid var(--border); border-radius:4px; color:var(--primary); font-size:.62rem; line-height:1.5; text-decoration:none; vertical-align:middle; }
  a.go:hover { background:var(--hover); border-color:var(--primary); }
  @media (max-width:640px) { .kv { grid-template-columns:repeat(2,1fr); } }
</style>

<script>
/* ===== tema (ikut shell) ===== */
(function () {
  function read() {
    try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') return t; } catch (e) {}
    try { const p = window.parent.document.documentElement.getAttribute('data-theme'); if (p === 'light' || p === 'dark') return p; } catch (e) {}
    return 'dark';
  }
  const set = t => document.documentElement.setAttribute('data-theme', t);
  set(read());
  setInterval(() => { const t = read(); if (t !== document.documentElement.getAttribute('data-theme')) set(t); }, 600);
})();

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = n => Number(n || 0).toLocaleString('id-ID');
const MON = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const fk = v => String(v || '').trim().toUpperCase();
const _nm = new Map();
const norm = s => { const k = String(s || ''); let v = _nm.get(k); if (v === undefined) { v = k.toUpperCase().replace(/[^A-Z0-9]/g, ''); _nm.set(k, v); } return v; };   /* di-cache: dipanggil jutaan kali */
const _tk = new Map();
const toks = s => { const k = String(s || ''); let v = _tk.get(k); if (!v) { v = k.toUpperCase().split(/[^A-Z0-9]+/).filter(w => w.length > 1); _tk.set(k, v); } return v; };

/* ===== baca IndexedDB (tanpa membuat database baru) ===== */
async function idbGet(db, st, key) {
  try {
    if (indexedDB.databases) { const l = await indexedDB.databases(); if (!l.some(x => x.name === db)) return null; }
  } catch (e) {}
  return new Promise(res => {
    const r = indexedDB.open(db);
    r.onerror = () => res(null);
    r.onsuccess = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains(st)) { d.close(); return res(null); }
      const q = d.transaction(st).objectStore(st).get(key);
      q.onsuccess = () => { d.close(); res(q.result || null); };
      q.onerror = () => { d.close(); res(null); };
    };
  });
}
function liveVar(frame, name) {
  try {
    const w = window.parent.document.getElementById('frame-' + frame).contentWindow;
    const v = w.eval(name);
    return v;
  } catch (e) { return undefined; }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

let SALES_ROWS = [], UM_ROWS = [], BATAL = {}, INV = [], APPROVED = {}, LUNAS_MAN = {};   /* LUNAS_MAN = faktur Titip yang sudah dicek manual & dinyatakan lunas */
async function loadData() {
  $('tb').querySelector('tbody').innerHTML = '<tr><td class="empty" colspan="10">Memuat data…</td></tr>';
  try { if (window.parent && window.parent.ensureFrame) { await Promise.all([window.parent.ensureFrame('penjualan'), window.parent.ensureFrame('uangmasuk')]); await sleep(1200); } } catch (e) {}
  /* Penjualan: pakai data hidup dari tab Penjualan bila ada, kalau tidak cache parse di IndexedDB */
  let pj = liveVar('penjualan', 'allData');
  if (!Array.isArray(pj) || !pj.length) {
    pj = [];
    const c = await idbGet('pj-parse-v1', 'c', 'parsed');
    if (c && c.files) Object.values(c.files).forEach(f => { if (f && Array.isArray(f.rows)) f.rows.forEach(r => pj.push(r)); });
  }
  SALES_ROWS = pj;
  let um = liveVar('uangmasuk', 'allRecords');
  if (!Array.isArray(um) || !um.length) { const u = await idbGet('um-fixv1', 'um-data', 'latest'); um = (u && u.records) || []; }
  UM_ROWS = um;
  let bm = liveVar('penjualan', 'batalMap');
  if (!bm || typeof bm !== 'object' || !Object.keys(bm).length) { const b = await idbGet('pjbatal-v1', 'pjbatal-data', 'latest'); bm = (b && b.items) || {}; }
  BATAL = bm;
  const cm = await idbGet('cek-v1', 'cek-data', 'latest');
  APPROVED = (cm && cm.items) || {};
  LUNAS_MAN = (cm && cm.lunas) || {};
  build();
  coverage();
  populate();
  applyQP();
  render();
  const miss = [];
  if (!SALES_ROWS.length) miss.push('Penjualan (buka PJ, upload file penjualan)');
  if (!UM_ROWS.length) miss.push('Uang Masuk (buka UM_V2 → Kelola Bulan → “Sinkron ke CEK”)');
  if (miss.length) $('cov').innerHTML += '<br><b style="color:#e0a030">Belum ada data: ' + miss.join(' · ') + '. Semua file harus dibuka di browser yang sama.</b>';
}

/* ===== bangun pasangan faktur penjualan ↔ uang masuk ===== */
function dmy(s) { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1].slice(2) : ''; }
function monthOf(t) { const m = String(t || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (!m) return ''; return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + m[2].padStart(2, '0'); }
/* OD (overdue): jatuh tempo = tanggal faktur + 12 hari; dihitung sampai hari ini. Mengembalikan jumlah hari terlambat (0 = belum jatuh tempo) */
const JT_HARI = 12;
function odDays(t) { const m = String(t || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (!m) return null;
  const y = m[3].length === 2 ? 2000 + (+m[3]) : +m[3], due = new Date(y, +m[2] - 1, +m[1] + JT_HARI), n = new Date(), today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.max(0, Math.round((today - due) / 86400000)); }
function sortKey(t) { const m = String(t || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (!m) return ''; return (m[3].length === 2 ? '20' + m[3] : m[3]) + m[2].padStart(2, '0') + m[1].padStart(2, '0'); }
function prodOfName(n) { return /FITRI/i.test(n || '') ? 'MINYAK' : 'RUPA'; }
function setLabel(s) { const a = [...s].sort(); if (a.length === 2) return 'CAMPUR'; return a[0] === 'MINYAK' ? 'MINYAK' : a[0] === 'RUPA' ? 'RUPA RUPA' : '-'; }
function lev(a, b) {
  if (a === b) return 0;
  let i0 = 0; const mn = Math.min(a.length, b.length);          /* buang awalan & akhiran yang sama (hasil identik, jauh lebih cepat) */
  while (i0 < mn && a.charCodeAt(i0) === b.charCodeAt(i0)) i0++;
  let e = 0; while (e < mn - i0 && a.charCodeAt(a.length - 1 - e) === b.charCodeAt(b.length - 1 - e)) e++;
  if (i0 || e) { a = a.slice(i0, a.length - e); b = b.slice(i0, b.length - e); }
  const n = a.length, m = b.length; if (!n) return m; if (!m) return n;
  let p = new Array(m + 1), c = new Array(m + 1);
  for (let j = 0; j <= m; j++) p[j] = j;
  for (let i = 1; i <= n; i++) {
    c[0] = i;
    for (let j = 1; j <= m; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1));
    const t = p; p = c; c = t;
  }
  return p[m];
}
/* lev dengan batas k: berhenti begitu pasti > k (cukup untuk uji "mirip >= 80%"), jauh lebih cepat */
function levBound(a, b, k) {
  let i0 = 0; const mn = Math.min(a.length, b.length);
  while (i0 < mn && a.charCodeAt(i0) === b.charCodeAt(i0)) i0++;
  let e = 0; while (e < mn - i0 && a.charCodeAt(a.length - 1 - e) === b.charCodeAt(b.length - 1 - e)) e++;
  if (i0 || e) { a = a.slice(i0, a.length - e); b = b.slice(i0, b.length - e); }
  const n = a.length, m = b.length; if (!n) return m; if (!m) return n; if (Math.abs(n - m) > k) return k + 1;
  const BIG = k + 1; let p = new Array(m + 1).fill(BIG), c = new Array(m + 1).fill(BIG);
  for (let j = 0; j <= Math.min(m, k); j++) p[j] = j;
  for (let i = 1; i <= n; i++) {
    const lo = Math.max(1, i - k), hi = Math.min(m, i + k);
    c[lo - 1] = (lo === 1) ? i : BIG; let rowMin = c[lo - 1];
    for (let j = lo; j <= hi; j++) {
      const v = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1));
      c[j] = v > BIG ? BIG : v; if (c[j] < rowMin) rowMin = c[j];
    }
    if (hi < m) c[hi + 1] = BIG;
    if (rowMin > k) return k + 1;
    const t = p; p = c; c = t;
  }
  return Math.min(p[m], k + 1);
}
const sim = (a, b) => { const l = Math.max(a.length, b.length); if (!l) return 1; const k = Math.floor(0.2 * l); if (Math.abs(a.length - b.length) > k) return 0; const d = levBound(a, b, k); return d > k ? 0 : 1 - d / l; };   /* hanya akurat untuk uji >= 0,8 (cara satu-satunya sim dipakai) */
/* 'OK' sama | 'NEAR' mirip tapi tidak sama (kemungkinan salah ketik) | 'DIFF' beda | null tidak bisa dibandingkan */
const _tc = new Map();
function textCmp(a, b) {                                   /* hasil di-cache per pasangan teks */
  const key = a + '\u0001' + b; let v = _tc.get(key);
  if (v === undefined) { v = textCmpRaw(a, b); _tc.set(key, v); }
  return v;
}
function textCmpRaw(a, b) {
  const x = norm(a), y = norm(b);
  if (!x || !y) return null;
  if (x === y) return 'OK';
  if (sim(x, y) >= 0.8) return 'NEAR';
  if (x.includes(y) || y.includes(x)) return 'OK';
  const t1 = toks(a), t2 = toks(b);
  if (t1.length && t2.length) { const s2 = new Set(t2); let k = 0; t1.forEach(w => { if (s2.has(w)) k++; }); if (k / Math.min(t1.length, t2.length) >= 0.6) return 'OK'; }
  return 'DIFF';
}
function salesCmp(a, b) {
  const r = textCmp(a, b);
  if (r === 'DIFF') { const x = toks(a)[0], y = toks(b)[0]; if (x && y && x === y) return 'OK'; }
  return r;
}
const days = k => { const m = String(k).match(/^(\d{4})(\d{2})(\d{2})$/); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) / 864e5 : NaN; };
function umProds(recs) {
  const U = new Set();
  recs.forEach(r => { if ((Number(r.minyak_cash) || 0) + (Number(r.minyak_tf) || 0) > 0) U.add('MINYAK'); if ((Number(r.rupa_cash) || 0) + (Number(r.rupa_tf) || 0) > 0) U.add('RUPA'); });
  return U;
}
const firstOf = (recs, f) => recs.map(f).find(v => v && String(v).trim()) || '';
/* Sales di Uang Masuk: "ALIM(RAJU)" = penerima uang ALIM, sales di faktur RAJU -> yang dibandingkan hanya isi kurung */
const salesOf = v => { const t = String(v || '').trim(), m = t.match(/\(([^()]*)\)/); return m && m[1].trim() ? m[1].trim() : t; };
const wantSec = pay => /^tempo$/i.test(pay) ? 'PIUTANG' : /^cash$/i.test(pay) ? 'CASH' : '';

function build() {
  const g = new Map();
  SALES_ROWS.forEach(r => { const k = fk(r['No. Faktur']); if (!k) return; let l = g.get(k); if (!l) g.set(k, l = []); l.push(r); });
  const umBy = new Map();
  UM_ROWS.forEach(r => { if (r.titip_aksi === 'BATAL') return; const k = fk(r.no_faktur); if (!k) return; let l = umBy.get(k); if (!l) umBy.set(k, l = []); l.push(r); });

  INV = [];
  g.forEach((lines, k) => {
    if (BATAL[k]) return;                                   /* faktur dibatalkan di tab Penjualan */
    const total = lines.reduce((s, r) => s + (Number(r.Total) || 0), 0);
    if (Math.abs(total) < 1) return;                        /* faktur nol = batal */
    const f = lines[0], pay = lines.map(r => r.Pembayaran).find(Boolean) || '';
    const net = new Map();
    lines.forEach(r => { const p = prodOfName(r.Produk); net.set(p, (net.get(p) || 0) + (Number(r.Total) || 0)); });
    const S = new Set(); net.forEach((v, p) => { if (Math.abs(v) >= 1) S.add(p); });
    INV.push({
      fk: k, tanggal: f.Tanggal || '', faktur: f['No. Faktur'] || k, total, sales: f.Sales || '', customer: f.Customer || '',
      alamat: f.Alamat || '', prod: S.size ? setLabel(S) : '-', pay, month: monthOf(f.Tanggal), sk: sortKey(f.Tanggal), um: [], S
    });
  });
  const byFk = new Map(INV.map(r => [r.fk, r]));
  INV.forEach(r => { r._d = days(r.sk); });

  /* ---- Pencocokan Uang Masuk -> Faktur Penjualan ----
     URUTAN PENCARIAN (bobot terbesar -> terkecil):
       1. Customer / Nama Toko   2. Alamat   3. Sales   4. Produk (Minyak Fitri / Rupa Rupa)   5. Nominal   6. (TERAKHIR) No Faktur
     No Faktur hanya pelengkap / pemutus seri, karena sering salah ketik.
     Hanya bila tidak ada faktur yang cocok lewat poin 1-5, barulah No Faktur yang sama persis dipakai (supaya selisihnya tetap ditandai). */
  const groups = new Map();                                  /* satu kelompok = baris uang masuk dengan No Faktur + Nama Toko yang sama */
  UM_ROWS.forEach(r => {
    if (r.titip_aksi === 'BATAL') return;
    const k = fk(r.no_faktur); if (!k) return;
    const gk = k + '|' + norm(r.nama_toko);
    let o = groups.get(gk); if (!o) groups.set(gk, o = { k, recs: [], taken: false });
    o.recs.push(r);
  });
  const paidOf = r => r.um.reduce((s, x) => s + (Number(x.total_bayar) || 0), 0);
  /* PERCEPATAN: jangan bandingkan tiap uang masuk dengan SEMUA faktur. Kandidat hanya faktur yang
     (a) nama tokonya cocok (dihitung sekali per nama unik, di-cache), (b) nominalnya sama, atau (c) No Faktur-nya sama persis. */
  const uniqCust = new Map();                                 /* nama customer unik -> daftar faktur */
  INV.forEach(r => { const k = norm(r.customer); let l = uniqCust.get(k); if (!l) uniqCust.set(k, l = []); l.push(r); });
  const byTotal = new Map();                                  /* total faktur (dibulatkan) -> daftar faktur */
  INV.forEach(r => { const k = Math.round(r.total); let l = byTotal.get(k); if (!l) byTotal.set(k, l = []); l.push(r); });
  const custCache = new Map();                                /* nama toko UM -> faktur yang customer-nya OK/NEAR */
  const custInvs = toko => {
    const key = norm(toko); if (!key) return [];
    let res = custCache.get(key); if (res) return res;
    const same = uniqCust.get(key);
    if (same) { custCache.set(key, same); return same; }     /* nama toko sama persis dengan customer faktur -> tak perlu cari yang mirip */
    res = [];
    uniqCust.forEach((list, ck) => { const c = textCmpRaw(list[0].customer, toko);   /* tanpa cache pasangan: sudah di-cache per nama toko */
      if (c === 'OK' || c === 'NEAR') res.push(...list); });
    custCache.set(key, res); return res;
  };
  const cands = [];
  groups.forEach(o => {
    const f0 = o.recs[0];
    o.paid = o.recs.reduce((s, r) => s + (Number(r.total_bayar) || 0), 0);
    const tg = Math.max(0, ...o.recs.map(r => Number(r.tagihan) || 0));
    const toko = firstOf(o.recs, r => r.nama_toko), alm = firstOf(o.recs, r => r.alamat), sls = salesOf(firstOf(o.recs, r => r.sales));
    o.toko = toko;
    const U = umProds(o.recs), sec = f0.section;
    const d0 = days(String(o.recs.map(r => r.tanggal_laporan_str).sort()[0] || '').replace(/-/g, ''));
    const kn = norm(o.k);
    const pool = new Set(custInvs(toko));
    const ex = byFk.get(o.k); if (ex) pool.add(ex);
    [o.paid, tg].forEach(v => { if (v > 0) for (let d = -1; d <= 1; d++) { const l = byTotal.get(Math.round(v) + d); if (l) l.forEach(r => pool.add(r)); } });
    /* No Faktur yang sama persis dipercaya bila tokonya cocok & tagihannya = total faktur: UM tsb TIDAK dipindah ke faktur lain
       (mis. input ganda / kelebihan bayar tetap ditandai di fakturnya sendiri, bukan disembunyikan sebagai cicilan faktur lain) */
    const exCu = ex ? textCmp(ex.customer, toko) : null;
    const lockExact = !!ex && (exCu === 'OK' || exCu === 'NEAR') && !(tg > 0 && Math.abs(tg - ex.total) > 1);
    pool.forEach(r => {
      const exact = r.fk === o.k;
      if (lockExact && !exact) return;
      if (!exact && LUNAS_MAN[r.fk]) return;                 /* faktur sudah dilunasi manual: tidak menerima uang masuk lain */
      if (d0 === d0 && r._d === r._d && d0 < r._d - 3) return;          /* uang masuk jauh sebelum faktur: bukan pasangannya */
      if (o.paid > r.total + 1) return;                      /* uang masuk tidak boleh melebihi total faktur */
      const rk = norm(r.fk), dk = exact ? 0 : ((kn.length >= 4 && rk.length >= 4 && Math.abs(kn.length - rk.length) <= 2) ? lev(kn, rk) : 99);
      const amt = (Math.abs(o.paid - r.total) <= 1) || (tg > 0 && Math.abs(tg - r.total) <= 1);
      const c = textCmp(r.customer, toko), custOk = c === 'OK' || c === 'NEAR';
      const a = textCmp(r.alamat, alm), almOk = a === 'OK' || a === 'NEAR';
      const sa = salesCmp(r.sales, sls), slsOk = sa === 'OK' || sa === 'NEAR';
      const prodOk = U.size > 0 && [...U].every(p => r.S.has(p));
      /* syarat masuk: toko cocok; atau (nama toko beda ketik) alamat + sales + nominal sama-sama cocok */
      if (!(custOk || (almOk && slsOk && amt))) return;
      let sc = 0;
      if (custOk) sc += 4;                                   /* 1. Customer / Nama Toko */
      if (almOk) sc += 3;                                    /* 2. Alamat */
      if (slsOk) sc += 2;                                    /* 3. Sales */
      if (prodOk) sc += 2;                                   /* 4. Produk */
      if (amt) sc += 3; else if (o.paid < r.total - 1) sc += 1;   /* 5. Nominal (cicilan = sebagian) */
      if (wantSec(r.pay) && wantSec(r.pay) === f0.section) sc += 1;
      if (dk <= 2) sc += 1;                                  /* 6. No Faktur: terakhir, hanya pelengkap */
      if (sc >= 8) cands.push({ r, o, sc, exact, dkOk: dk <= 2, almOk, slsOk });
    });
  });
  cands.sort((x, y) => (y.sc - x.sc) || ((y.exact ? 1 : 0) - (x.exact ? 1 : 0)) || (x.r.sk < y.r.sk ? -1 : x.r.sk > y.r.sk ? 1 : 0));
  const attach = (o, r) => {
    o.taken = true; o.to = r; r.um = r.um.concat(o.recs);
    const tf = firstOf(o.recs, x => x.no_faktur) || o.k;
    if (fk(tf) !== r.fk) r.typoFaktur = r.typoFaktur ? r.typoFaktur + '", "' + tf : tf;
  };
  cands.forEach(c => {
    if (c.o.taken) return;
    if (c.r.um.length && !c.exact) {                         /* faktur sudah punya uang masuk -> ini cicilan lanjutan */
      if (c.r.um.some(x => x.titip_aksi === 'LUNAS')) return;
      if (!(c.dkOk || (c.almOk && c.slsOk))) return;
    }
    if (paidOf(c.r) + c.o.paid > c.r.total + 1) return;      /* cicilan tidak boleh melebihi total faktur */
    attach(c.o, c.r);
  });
  /* tidak ada yang cocok lewat Customer/Alamat/Sales/Produk/Nominal -> pakai No Faktur yang sama persis (selisihnya akan ditandai) */
  groups.forEach(o => { if (!o.taken && byFk.has(o.k)) attach(o, byFk.get(o.k)); });
  /* No Faktur di Uang Masuk milik faktur lain: tandai faktur aslinya */
  groups.forEach(o => {
    if (!o.to || o.to.fk === o.k) return;
    const kf = byFk.get(o.k);
    if (kf && !kf.um.length) { kf.movedTo = o.to; kf.movedToko = o.toko; }
  });
  const orph = [...groups.values()].filter(o => !o.taken);

  INV.forEach(r => {
    evaluate(r, r.S);
    if (r.movedTo) r.info = 'Belum ada uang masuk. Uang masuk dengan No Faktur ini ternyata milik faktur ' + r.movedTo.faktur + ' (' + r.movedToko + ') — salah ketik No Faktur di Uang Masuk';
  });

  /* Uang Masuk yang tetap tidak menemukan faktur */
  orph.forEach(o => {
    const f = o.recs[0], paid = o.recs.reduce((s, r) => s + (Number(r.total_bayar) || 0), 0), U = umProds(o.recs);
    const d0 = o.recs.map(r => r.tanggal_laporan_str).filter(Boolean).sort()[0] || '';
    const toko = firstOf(o.recs, r => r.nama_toko), alm = firstOf(o.recs, r => r.alamat), sls = salesOf(firstOf(o.recs, r => r.sales));
    INV.push({
      orph: true, fk: o.k, tanggal: dmy(d0), faktur: f.no_faktur, total: paid, sales: sls, customer: toko, alamat: alm,
      prod: U.size ? setLabel(U) : '-', pay: f.section === 'PIUTANG' ? 'Tempo' : f.section === 'CASH' ? 'Cash' : '', month: d0.slice(0, 7), sk: d0.replace(/-/g, ''),
      um: o.recs, status: 'TANPA FAKTUR', cat: 'ORPH',
      issues: [g.has(o.k) ? 'No Faktur "' + f.no_faktur + '" ada di penjualan tetapi dibatalkan / bernilai nol' : 'No Faktur "' + f.no_faktur + '" tidak ditemukan di data penjualan (salah ketik?)'],
      info: [toko, alm, sls].filter(Boolean).join(' · ') + ' — ' + o.recs.slice().sort((a, b) => (a.tanggal_laporan_str || '').localeCompare(b.tanggal_laporan_str || ''))
        .map(r => dmy(r.tanggal_laporan_str) + ' ' + (r.section === 'PIUTANG' ? 'Piutang' : 'Cash Drop') + ' ' + fmt(r.total_bayar)).join(' · ')
    });
  });
  INV.sort((a, b) => a.sk === b.sk ? a.fk.localeCompare(b.fk) : (!a.sk ? 1 : !b.sk ? -1 : (a.sk < b.sk ? -1 : 1)));   /* tanggal terlama di atas */
}

function evaluate(rec, S) {
  const um = rec.um;
  rec.lunasMan = null;
  if (!um.length && LUNAS_MAN[rec.fk]) { rec.paid = 0; rec.status = 'LUNAS'; rec.cat = 'OK'; rec.issues = []; rec.lunasMan = LUNAS_MAN[rec.fk]; rec.info = 'Tidak ada catatan uang masuk (dilunasi manual)'; return; }
  if (!um.length) { rec.status = 'BELUM MASUK'; rec.cat = 'NONE'; rec.issues = []; rec.info = 'Belum ada uang masuk untuk faktur ini'; return; }
  const paid = um.reduce((s, r) => s + (Number(r.total_bayar) || 0), 0);
  const manual = um.some(r => r.titip_aksi === 'LUNAS');
  rec.paid = paid;
  rec.status = (manual || paid >= rec.total - 1) ? 'LUNAS' : 'TITIP';
  rec.lunasMan = null;
  if (rec.status === 'TITIP' && LUNAS_MAN[rec.fk]) { rec.status = 'LUNAS'; rec.lunasMan = LUNAS_MAN[rec.fk]; }   /* dipindahkan manual dari Titip ke Lunas */
  const issues = [];
  const lbl = (r, nama, a, b) => nama + (r === 'NEAR' ? ' mirip tapi beda (kemungkinan salah ketik): faktur "' : ' berbeda: faktur "') + a + '" vs uang masuk "' + b + '"';
  const toko = firstOf(um, r => r.nama_toko), alamat = firstOf(um, r => r.alamat);
  let c = textCmp(rec.customer, toko); if (c === 'NEAR' || c === 'DIFF') issues.push(lbl(c, 'Customer / Nama Toko', rec.customer, toko));
  /* Alamat: ejaan mirip (KARANSAMBUNG / KARANG SAMBUNG, SIDOHARJO / SIDOARJO) dianggap sama HANYA bila di Uang Masuk
     ada keterangan LUNAS (kolom Status) DAN nominalnya sudah sama dengan faktur; tanpa ket LUNAS + alamat mirip tetap ditandai */
  const ketLunas = rec.status === 'LUNAS' && (!!rec.lunasMan || um.some(r => r.titip_aksi === 'LUNAS') ||
    um.some(r => { const t = String(r.status || '').toUpperCase(); return t.includes('LUNAS') && !/(BELUM|BLM|BLOM|TDK|TIDAK)\s*LUNAS/.test(t); }));
  c = textCmp(rec.alamat, alamat); if (alamat && (c === 'DIFF' || (c === 'NEAR' && !ketLunas))) issues.push(lbl(c, 'Alamat', rec.alamat, alamat));
  const sUm = [...new Set(um.map(r => String(r.sales || '').trim()).filter(Boolean))];
  if (sUm.length) {
    const res = sUm.map(x => salesCmp(rec.sales, salesOf(x)));
    if (!res.includes('OK')) issues.push(lbl(res.includes('NEAR') ? 'NEAR' : 'DIFF', 'Sales', rec.sales, sUm.join(', ')));
  }
  const U = umProds(um);
  const extra = [...U].filter(p => !S.has(p)), miss = (rec.status === 'LUNAS' && !rec.lunasMan) ? [...S].filter(p => !U.has(p)) : [];
  const pn = p => p === 'MINYAK' ? 'Minyak' : 'Rupa Rupa';
  if (extra.length) issues.push('Produk: faktur ' + rec.prod + ', uang masuk tercatat di kolom ' + extra.map(pn).join(' + '));
  if (miss.length) issues.push('Produk ' + miss.map(pn).join(' + ') + ' tidak tercatat di uang masuk');
  const want = wantSec(rec.pay);
  if (want) {
    const wrong = um.filter(r => r.section && r.section !== want);
    if (wrong.length) issues.push('Pembayaran ' + rec.pay + ' seharusnya ' + (want === 'PIUTANG' ? 'Piutang Tempo' : 'Cash Dropping') + ', tercatat di ' + (wrong[0].section === 'PIUTANG' ? 'Piutang Tempo' : 'Cash Dropping'));
  }
  const tg = Math.max(0, ...um.map(r => Number(r.tagihan) || 0));
  if (tg > 0 && Math.abs(tg - rec.total) > 1) issues.push('Tagihan uang masuk ' + fmt(tg) + ' ≠ total faktur ' + fmt(rec.total));
  if (rec.typoFaktur) issues.push('No Faktur di uang masuk "' + rec.typoFaktur + '" ≠ faktur "' + rec.faktur + '" (kemungkinan salah ketik, dicocokkan lewat customer/nominal)');
  if (rec.status === 'TITIP') issues.push('Baru dibayar ' + fmt(paid) + ' dari ' + fmt(rec.total) + ' (sisa ' + fmt(rec.total - paid) + ')');
  rec.issues = issues;
  rec.info = um.slice().sort((a, b) => (a.tanggal_laporan_str || '').localeCompare(b.tanggal_laporan_str || ''))
    .map(r => dmy(r.tanggal_laporan_str) + ' ' + (r.section === 'PIUTANG' ? 'Piutang' : 'Cash Drop') + ' ' + fmt(r.total_bayar)).join(' · ');
  /* TITIP murni (hanya belum lunas) bukan salah catat */
  rec.cat = issues.filter(i => !/^Baru dibayar/.test(i)).length ? 'DIFF' : (rec.status === 'TITIP' ? 'TITIP' : 'OK');
  rec.sig = issues.join('|');
  const ap = APPROVED[rec.fk];
  if (rec.cat === 'DIFF' && ap) { if (ap.sig === rec.sig) { rec.cat = rec.status === 'TITIP' ? 'TITIP' : 'OK'; rec.manual = ap; } else rec.reopened = ap; }
}

/* ===== filter & tampilan ===== */
let state = { f: 'ALL', page: 1, size: 100, monthDone: false };

function inMonth(r, m) {

}
function baseRows() {

let VIEW = [];

  { const ti = base.filter(r => r.cat === 'TITIP'), sisa = ti.reduce((t, r) => t + Math.max(0, (Number(r.total) || 0) - (Number(r.paid) || 0)), 0);

  $('nAll').textContent = fmt(base.length);

  const st = (state.page - 1) * state.size, rows = VIEW.slice(st, st + state.size);
  const showOD = state.f === 'NONE', nc = showOD ? 11 : 10;
  $('tb').querySelector('thead').innerHTML =
    '<tr><th class="g1" colspan="' + (nc - 2) + '">DATA PENJUALAN</th><th class="g2" colspan="2">DATA UANG MASUK</th></tr>' +

/* ===== penyimpanan keputusan manual (database cek-v1, ikut backup / sinkron) ===== */
function idbPut(db, st, key, val) {
  return new Promise((ok, no) => {
    const put = d => { const tx = d.transaction(st, 'readwrite'); tx.objectStore(st).put(val, key); tx.oncomplete = () => { d.close(); ok(); }; tx.onerror = tx.onabort = () => { d.close(); no(tx.error); }; };
    const r = indexedDB.open(db);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(st)) r.result.createObjectStore(st); };
    r.onerror = () => no(r.error);
    r.onsuccess = () => {
      const d = r.result; d.onversionchange = () => d.close();
      if (d.objectStoreNames.contains(st)) return put(d);
      const nv = d.version + 1; d.close();
      const u = indexedDB.open(db, nv);
      u.onupgradeneeded = () => u.result.createObjectStore(st);
      u.onsuccess = () => put(u.result); u.onerror = () => no(u.error);
    };
  });
}

  await idbPut('cek-v1', 'cek-data', 'latest', { items: APPROVED, lunas: LUNAS_MAN });

    '<h4>Temuan</h4>' + (r.issues.length ? r.issues.map(x => '<div><span class="x">' + esc(x) + '</span></div>').join('') : '<div class="dim">' + (r.cat === 'NONE' ? esc(r.info) : '—') + '</div>') +
    '<h4>Catatan Uang Masuk (' + r.um.length + ')</h4><table class="mt"><thead><tr><th>Tgl Laporan</th><th>Section</th><th>No Faktur UM</th><th>Nama Toko</th><th>Alamat</th><th>Sales</th><th>Produk</th><th>Bayar</th><th>Status</th></tr></thead><tbody>' +
    r.um.slice().sort((a, b) => (a.tanggal_laporan_str || '').localeCompare(b.tanggal_laporan_str || '')).map(u =>
      '<tr><td>' + dmy(u.tanggal_laporan_str) + '</td><td>' + (u.section === 'PIUTANG' ? 'Piutang Tempo' : 'Cash Dropping') + '</td><td>' + esc(u.no_faktur) + '</td><td>' + esc(u.nama_toko) + '</td><td>' + esc(u.alamat) + '</td><td>' + esc(u.sales) + '</td><td>' + pnm(u) + '</td><td style="text-align:right">' + fmt(u.total_bayar) + '</td><td>' + esc(u.status) + '</td></tr>').join('') +
    '</tbody></table><h4>Catatan saya</h4><textarea id="mNote" placeholder="' + (isTi ? 'Mis. sudah dicek manual, pelanggan sudah bayar / transfer tanggal …' : 'Mis. sudah dicek, memang nama toko berbeda…') + '">' + esc(r.lunasMan ? (r.lunasMan.note || '') : (r.manual ? (r.manual.note || '') : '')) + '</textarea>';
  $('mFoot').innerHTML = '<button type="button" class="btn" data-m="x">Tutup</button>' +
    (r.lunasMan ? '<button type="button" class="btn" data-m="lsave">💾 Simpan Catatan</button><button type="button" class="btn warn" data-m="lundo">↺ Kembalikan ke Titip</button>'
      : (r.cat === 'TITIP' || r.cat === 'NONE') ? '<button type="button" class="btn ok" data-m="lok">✓ Pindahkan ke Lunas / Sesuai</button>' : '') +
    (isTi && r.cat !== 'DIFF' ? '' : r.manual ? '<button type="button" class="btn warn" data-m="undo">↺ Kembalikan ke Ada Beda Data</button>' : '<button type="button" class="btn ok" data-m="ok">✓ Pindahkan ke Sesuai</button>');
  $('ov').classList.add('show');
}
function closeModal() { $('ov').classList.remove('show'); cur = null; }
async function modalAct(a) {
  if (a === 'x') return closeModal();
  if (!cur) return;
  const note = ($('mNote').value || '').trim();
  if (a === 'lok' || a === 'lsave') LUNAS_MAN[cur.fk] = { at: (LUNAS_MAN[cur.fk] || {}).at || Date.now(), note, paid: cur.paid || 0, total: cur.total };
  else if (a === 'lundo') delete LUNAS_MAN[cur.fk];
  else if (a === 'ok') APPROVED[cur.fk] = { at: Date.now(), note: ($('mNote').value || '').trim(), sig: cur.sig };
  else delete APPROVED[cur.fk];
  try { await saveApproved(); } catch (e) { alert('Gagal menyimpan: ' + e.message); return; }
  closeModal(); build(); render();
}

/* ===== sinkron dengan shell ===== */
let stale = false, reloadTimer = null;
window.onTabShow = function () { if (stale || !SALES_ROWS.length) { stale = false; loadData(); } };
/* Mode berdiri sendiri (PJ / UM_V2 / CEK = file terpisah): data berubah di file lain → muat ulang otomatis */
function reloadIfStale() {
  if (!stale || document.visibilityState !== 'visible' || $('ov').classList.contains('show')) return;
  stale = false; loadData();
}
try {
  new BroadcastChannel('laporan-data').onmessage = e => {
    if (e.data === 'cek') return;                 /* pesan dari CEK sendiri (simpan keputusan) → abaikan */
    stale = true;
    clearTimeout(reloadTimer); reloadTimer = setTimeout(reloadIfStale, 800);
  };
} catch (e) {}
document.addEventListener('visibilitychange', reloadIfStale);
window.addEventListener('focus', reloadIfStale);
loadData();
